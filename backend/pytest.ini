[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 严格模式：仅 @pytest.mark.asyncio 标记的用例走 async event loop
asyncio_mode = strict

# Markers
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test

# Coverage
addopts =
    --verbose
    --strict-markers
    --tb=short
