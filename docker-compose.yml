version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: moontest-postgres
    environment:
      POSTGRES_USER: moontest
      POSTGRES_PASSWORD: moontest123
      POSTGRES_DB: moontest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - moontest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moontest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moontest-redis
    ports:
      - "6379:6379"
    networks:
      - moontest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: moontest-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    networks:
      - moontest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build: ./backend
    container_name: moontest-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://moontest:moontest123@postgres:5432/moontest
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: admin
      STORAGE_SECRET_KEY: password123
      MODEL_API_URL: ${MODEL_API_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_NAME: ${MODEL_NAME:-qwen-plus}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - moontest-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    container_name: moontest-worker
    environment:
      DATABASE_URL: postgresql://moontest:moontest123@postgres:5432/moontest
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: admin
      STORAGE_SECRET_KEY: password123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moontest-network
    volumes:
      - ./backend:/app
    command: celery -A app.tasks worker --loglevel=info

  frontend:
    build: ./frontend
    container_name: moontest-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - moontest-network

volumes:
  postgres_data:
  minio_data:

networks:
  moontest-network:
    driver: bridge
